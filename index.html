<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Family Battle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>FAMILY BATTLE</h1>

    <div id="hud">
        <div>
            SUCCESS
            <div class="health">
                <div id="playerHealth"></div>
            </div>
            <span id="playerHealthText">100 / 100</span>
        </div>

        <div id="kills">
            KILLS: <span id="killCount">0</span>
        </div>
    </div>

    <div id="game">

        <div id="player">🦸</div>

    </div>

    <div class="controls">

        <button id="leftBtn">◀</button>

        <button id="fireButton">🔥 FIRE</button>

        <button id="rightBtn">▶</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
